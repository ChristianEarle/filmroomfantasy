# filmroom-ingest: the ingest job Worker (src/ingest/). A */5 cron runs the
# dispatcher, which leases due jobs from D1 and sends them to the `ingest`
# queue; the queue consumers run them. It serves no HTTP. A job group is only
# leased once its ingest_owner row says 'ingest' (POST /api/admin/ingest/owner);
# until then the filmroom-api cron keeps running it. See DEPLOY.md.
#
# Deploy: npx wrangler deploy -c wrangler.ingest.toml
# Secrets: wrangler secret put ODDS_API_KEY -c wrangler.ingest.toml
name = "filmroom-ingest"
main = "src/ingest/worker.ts"
compatibility_date = "2024-06-01"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "filmroom-db"
database_id = "6acfacc9-ccdd-46bd-9cea-8693306ed524"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "ingest"

[[queues.producers]]
binding = "INGEST_INTERACTIVE_QUEUE"
queue = "ingest-interactive"

# max_retries = 0: the consumer acks every message whose outcome it recorded,
# so an un-acked message means the invocation was killed, and it goes straight
# to ingest-dlq, whose consumer marks the run killed.
[[queues.consumers]]
queue = "ingest"
max_batch_size = 1
max_retries = 0
dead_letter_queue = "ingest-dlq"
max_concurrency = 4

[[queues.consumers]]
queue = "ingest-interactive"
max_batch_size = 1
max_retries = 0
dead_letter_queue = "ingest-dlq"
max_concurrency = 2

[[queues.consumers]]
queue = "ingest-dlq"
max_batch_size = 10
max_retries = 3

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
TWITTER_RSS_URLS = "https://www.espn.com/espn/rss/nfl/news|ESPN NFL,https://www.cbssports.com/rss/headlines/nfl|CBS Sports NFL,https://www.espn.com/espn/rss/nfl/headlines|ESPN NFL Headlines,https://sports.yahoo.com/nfl/rss.xml|Yahoo Sports NFL,https://www.rotowire.com/rss/news.php?sport=NFL|RotoWire NFL,https://www.pff.com/feed|Pro Football Focus"

[limits]
cpu_ms = 300000

[observability]
enabled = true
