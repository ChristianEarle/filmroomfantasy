name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Build & Type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (Type-check & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        # --legacy-peer-deps: @cloudflare/vitest-pool-workers pulls in a newer
        # wrangler whose peerOptional @cloudflare/workers-types (v5) conflicts
        # with drizzle-orm's v4 peer range. Both ranges are satisfied in
        # practice; this just stops npm's strict resolver from erroring on it.
        run: npm ci --legacy-peer-deps || npm ci --legacy-peer-deps

      - name: Type-check
        working-directory: server
        run: npx tsc --noEmit

      - name: Test
        working-directory: server
        run: npm test

      # The tests load only wrangler.toml, so this is the one place a PR
      # validates wrangler.ingest.toml and the ingest Worker's bundle. Needs
      # no credentials: --dry-run uploads nothing. A PR gate only: on main
      # the deploy job needs this job, and an ingest-only break must not stop
      # the API deploying ('Deploy ingest Worker' turns that run red instead).
      - name: Build ingest Worker (dry run)
        continue-on-error: ${{ github.event_name == 'push' }}
        working-directory: server
        run: npx wrangler deploy -c wrangler.ingest.toml --dry-run --outdir "$RUNNER_TEMP/ingest-dry-run"

  deploy:
    name: Deploy to Cloudflare
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two pushes in quick succession must not apply migrations or deploy the
    # Workers concurrently; the later run waits for the earlier one.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0dc32f5bf8763383e2672dcf5bba7a0b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Build + full prerender (puppeteer boots the built SPA, visits each
      # public route, waits for React + the production API to respond, and
      # rewrites <route>/index.html with fully-rendered HTML). Uses the Chrome
      # that ships pre-installed on ubuntu-latest runners at
      # /usr/bin/google-chrome-stable; scripts/prerender.js probes that path.
      - name: Build frontend (with prerender)
        run: npm run build:prerender
        env:
          VITE_API_URL: https://filmroom-api.earle2001.workers.dev/api

      - name: Install backend dependencies
        working-directory: server
        run: npm ci --legacy-peer-deps || npm ci --legacy-peer-deps

      - name: Apply migrations
        working-directory: server
        run: npx wrangler d1 migrations apply filmroom-db --remote --env=""

      # filmroom-ingest (wrangler.ingest.toml, see DEPLOY.md). Its failure must
      # not hold back the API or Pages, so it is allowed to fail here and the
      # last step turns the job red afterwards. The step timeout stops a
      # stalled deploy from using up the job's 20 minutes before the API's turn.
      - name: Deploy ingest Worker
        id: ingest
        continue-on-error: true
        timeout-minutes: 5
        working-directory: server
        run: npx wrangler deploy -c wrangler.ingest.toml

      - name: Deploy API Worker
        working-directory: server
        run: npx wrangler deploy --env=""

      - name: Deploy Pages
        run: npx wrangler pages deploy build --project-name=filmroom --commit-message="CI deploy ${{ github.sha }}"

      # Runs only once the API and Pages deployed. != 'success' so a deploy
      # stopped by its timeout counts too, whichever outcome it reports.
      - name: Fail if the ingest Worker did not deploy
        if: steps.ingest.outcome != 'success'
        run: |
          echo "::error::filmroom-ingest failed to deploy (see the 'Deploy ingest Worker' step). The API and Pages deployed."
          exit 1
